<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio des notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
	:root {
		--bg: #f4f4f1;
		--surface: #ffffff;
		--line: #e2e2dc;
		--ink: #16161a;
		--muted: #6b6b70;
		--accent: #2f5bd8;
		--ok: #1f7a4d;
		--warn: #a86400;
		--err: #b3261e;
		--chosen: #1f7a4d;
		--desk: #c9ccd3;
	}
	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]) {
			--bg: #111214;
			--surface: #1a1b1e;
			--line: #2c2d31;
			--ink: #ececee;
			--muted: #9a9aa2;
			--accent: #7a9cff;
			--ok: #5cc38f;
			--warn: #e0a64a;
			--err: #ff7b72;
			--chosen: #5cc38f;
			--desk: #2a2d33;
		}
	}
	:root[data-theme="dark"] {
		--bg: #111214;
		--surface: #1a1b1e;
		--line: #2c2d31;
		--ink: #ececee;
		--muted: #9a9aa2;
		--accent: #7a9cff;
		--ok: #5cc38f;
		--warn: #e0a64a;
		--err: #ff7b72;
		--chosen: #5cc38f;
		--desk: #2a2d33;
	}
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
	header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
	header h1 { font-size: 16px; margin: 0; font-weight: 600; }
	header .spacer { flex: 1; }
	header label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
	#saved { font-size: 12px; color: var(--muted); min-width: 90px; text-align: right; }
	select, input, textarea, button { font: inherit; color: inherit; }
	select, input[type=text], textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
	textarea { width: 100%; resize: vertical; }
	button.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
	button.btn:hover { border-color: var(--muted); }
	button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
	button.btn.choose.on { background: var(--chosen); border-color: var(--chosen); color: #fff; }
	.layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 58px); }
	nav { border-right: 1px solid var(--line); padding: 12px 8px; background: var(--surface); }
	nav button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
	nav button:hover { background: var(--bg); }
	nav button.on { background: var(--bg); font-weight: 600; }
	nav .pick { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
	nav .pick.done { color: var(--chosen); }
	nav hr { border: 0; border-top: 1px solid var(--line); margin: 8px 4px; }
	main { padding: 18px 20px 60px; min-width: 0; }
	.moment { color: var(--muted); margin: 0 0 16px; max-width: 900px; }
	.moment b { color: var(--ink); font-weight: 500; }
	.columns { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
	.col { width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
	.col.chosen { border-color: var(--chosen); box-shadow: 0 0 0 1px var(--chosen); }
	.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
	.col-head input { flex: 1; font-weight: 600; background: transparent; border-color: transparent; }
	.col-head input:hover, .col-head input:focus { border-color: var(--line); }
	.desk { background: var(--desk); padding: 18px 20px; display: flex; justify-content: center; }
	.checks { list-style: none; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
	.checks li { padding: 1px 0; }
	.checks .ok { color: var(--ok); }
	.checks .warn { color: var(--warn); }
	.checks .err { color: var(--err); }
	.editor { padding: 10px 12px; display: grid; gap: 8px; }
	.field label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
	.field input[type=text] { width: 100%; }
	.btnrow { display: grid; grid-template-columns: 1fr 86px 24px 24px; gap: 4px; align-items: center; margin-bottom: 4px; }
	.btnrow .value { grid-column: 1 / -1; margin-bottom: 6px; font-size: 12px; }
	.btnrow input[type=radio] { margin: 0; justify-self: center; }
	.icon { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 15px; padding: 0; }
	.icon:hover { color: var(--err); }
	.tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
	.sendinfo { font-size: 12px; color: var(--muted); padding: 0 12px 10px; min-height: 18px; }
	.notes { margin-top: 22px; max-width: 900px; }
	.notes h2, .overview h2 { font-size: 14px; margin: 0 0 6px; }
	.rules { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
	.overview .grid { display: flex; flex-wrap: wrap; gap: 16px; }
	.overview .cell { width: 380px; }
	.overview .cell h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
	.overview .cell .desk { border-radius: 10px; }

	/* ---- Le panneau Screenpipe, d'après app/notification-panel/page.tsx et notification-action-button.tsx */
	.sp { --spbg: 0 0% 4%; --spfg: 0 0% 96%; width: 340px; background: hsl(var(--spbg) / 0.96); border: 1px solid hsl(var(--spfg) / 0.08); border-radius: 8px; font-family: "IBM Plex Mono", monospace; color: hsl(var(--spfg) / 0.8); box-shadow: 0 4px 16px hsl(var(--spfg) / 0.12); overflow: hidden; text-align: left; }
	.sp.light { --spbg: 60 14% 96%; --spfg: 0 0% 4%; }
	.sp.tall { height: 380px; display: flex; flex-direction: column; }
	.sp.tall .sp-body { flex: 1; overflow: auto; }
	.sp-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 0; }
	.sp-brand { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 500; letter-spacing: .05em; color: hsl(var(--spfg) / 0.4); }
	.sp-logo { width: 14px; height: 14px; border-radius: 3px; background: hsl(var(--spfg) / 0.85); }
	.sp-x { font-size: 14px; color: hsl(var(--spfg) / 0.35); display: flex; gap: 12px; align-items: center; }
	.sp-body { padding: 8px 14px; }
	.sp-title { font-size: 12px; font-weight: 500; margin-bottom: 4px; color: hsl(var(--spfg) / 0.9); }
	.sp-md { font-size: 11px; line-height: 1.4; color: hsl(var(--spfg) / 0.5); }
	.sp-md p { margin: 0 0 4px; }
	.sp-md p:last-child { margin: 0; }
	.sp-md strong { color: hsl(var(--spfg) / 0.9); font-weight: 600; }
	.sp-md a { color: hsl(var(--spfg) / 0.7); text-decoration: underline; }
	.sp-md code { background: hsl(var(--spfg) / 0.06); padding: 1px 4px; font-size: 10px; font-family: inherit; }
	.sp-md ul { margin: 2px 0; padding-left: 16px; }
	.sp-actions { display: flex; align-items: center; gap: 8px; padding: 0 14px 10px; flex-wrap: nowrap; min-width: 0; }
	.sp-btn { display: block; flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: hsl(var(--spfg) / 0.04); border: 1px solid hsl(var(--spfg) / 0.12); border-radius: 6px; color: hsl(var(--spfg) / 0.8); padding: 6px 10px; font: 500 10px/1.4 "IBM Plex Mono", monospace; letter-spacing: .03em; cursor: pointer; }
	.sp-actions.share .sp-btn { flex: 1 1 0; }
	.sp-btn.primary { background: hsl(var(--spfg) / 0.88); color: hsl(var(--spbg)); }
	.sp-btn.cut { outline: 1px dashed var(--err); outline-offset: 1px; }

	@media (max-width: 760px) {
		.layout { grid-template-columns: 1fr; }
		nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; }
		nav button { width: auto; white-space: nowrap; }
		nav hr { display: none; }
		main { padding: 14px 16px 40px; }
		.col, .overview .cell { width: 100%; }
		.desk { padding: 14px 8px; }
		.sp { width: 100%; max-width: 340px; }
	}
</style>
</head>
<body>
<header>
	<h1>Studio des notifications</h1>
	<label>Panneau <select id="sp-theme"><option value="dark">sombre</option><option value="light">clair</option></select></label>
	<label><input type="checkbox" id="sp-tall"> hauteur de la fenêtre (340 × 380)</label>
	<span class="spacer"></span>
	<span id="saved"></span>
</header>
<div class="layout">
	<nav id="nav"></nav>
	<main id="main"></main>
</div>
<script>
const KIND_LABEL = { lien: "lien", copier: "copier", retour: "retour" };
let state = null;
let current = "__overview";
const view = { theme: localGet("sp-theme", "dark"), tall: localGet("sp-tall", "0") === "1", overview: localGet("studio-overview", "c") };

function localGet(key, fallback) { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } }
function localSet(key, value) { try { localStorage.setItem(key, value); } catch {} }
const esc = (text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Markdown comme le panneau : ReactMarkdown sans remark-breaks, un saut de ligne simple devient une espace.
function inline(text) {
	return esc(text)
		.replace(/`([^`]+)`/g, "<code>$1</code>")
		.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
		.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(body) {
	return body.split(/\n\s*\n/).filter((block) => block.trim()).map((block) => {
		const lines = block.split("\n");
		if (lines.every((line) => /^\s*[-*] /.test(line))) return `<ul>${lines.map((line) => `<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
		return `<p>${inline(lines.join(" "))}</p>`;
	}).join("");
}

function panel(variant) {
	const share = variant.buttons.length > 1 ? " share" : "";
	const buttons = variant.buttons.map((button) => `<button class="sp-btn${button.primary ? " primary" : ""}" title="${esc(button.kind === "lien" ? button.value : button.kind === "copier" ? `Copie : ${button.value}` : "Retour au démon")}">${esc(button.label)}</button>`).join("");
	return `<div class="sp${view.theme === "light" ? " light" : ""}${view.tall ? " tall" : ""}">
		<div class="sp-head"><span class="sp-brand"><span class="sp-logo"></span>screenpipe</span><span class="sp-x"><span>···</span><span>✕</span></span></div>
		<div class="sp-body"><div class="sp-title">${esc(variant.title)}</div><div class="sp-md">${markdown(variant.body)}</div></div>
		${variant.buttons.length ? `<div class="sp-actions${share}">${buttons}</div>` : ""}
	</div>`;
}

const EMOJI = /\p{Extended_Pictographic}/u;
function checks(variant, cut) {
	const out = [];
	const t = variant.title.length;
	out.push(t <= 32 ? ["ok", `Titre : ${t} caractères`] : [t <= 40 ? "warn" : "err", `Titre : ${t} caractères (32 au plus : une ligne)`]);
	const paragraphs = variant.body.split(/\n\s*\n/).filter((block) => block.trim()).length;
	out.push(paragraphs <= 1 ? ["ok", paragraphs ? "Corps : 1 ligne" : "Pas de corps : le titre suffit"] : [paragraphs === 2 ? "warn" : "err", `Corps : ${paragraphs} lignes (1 au plus)`]);
	if (/[^\n]\n[^\n]/.test(variant.body)) out.push(["warn", "Saut de ligne simple : Screenpipe le remplace par une espace. Laisser une ligne vide."]);
	const words = `${variant.title} ${variant.body}`.replace(/[`*]/g, "").split(/\s+/).filter(Boolean).length;
	// Un coup d'œil pendant que le client parle : 3 s, soit une douzaine de mots.
	const seconds = Math.max(1, Math.round(words / 4));
	out.push([seconds <= 3 ? "ok" : seconds <= 5 ? "warn" : "err", `Lecture : ${words} mots, environ ${seconds} s (3 s au plus)`]);
	const n = variant.buttons.length;
	out.push(n <= 2 ? ["ok", `${n} bouton${n > 1 ? "s" : ""}`] : [n === 3 ? "warn" : "err", `${n} boutons (2 au plus : une action, et au besoin « plus tard »)`]);
	const primaries = variant.buttons.filter((button) => button.primary).length;
	if (primaries > 1) out.push(["warn", `${primaries} boutons principaux : un seul ressort`]);
	if (n && !variant.buttons[0].primary) out.push(["warn", "Le premier bouton n'est pas le principal"]);
	for (const label of cut) out.push(["err", `Bouton coupé : « ${label} »`]);
	const all = `${variant.title} ${variant.body} ${variant.buttons.map((b) => b.label).join(" ")}`;
	if (EMOJI.test(all)) out.push(["err", "Emoji (règle Screenpipe : aucun)"]);
	if (all.includes("!")) out.push(["err", "« ! » (règle Screenpipe : aucun)"]);
	return out.map(([level, text]) => `<li class="${level}">${level === "ok" ? "✓" : level === "warn" ? "!" : "✕"} ${esc(text)}</li>`).join("");
}

function currentCase() { return state.cases.find((c) => c.key === current); }
function findVariant(id) { for (const c of state.cases) for (const v of c.variants) if (v.id === id) return [c, v]; return []; }

function renderNav() {
	const items = state.cases.map((c) => {
		const chosen = c.variants.find((v) => v.id === state.choices[c.key]);
		return `<button data-case="${c.key}" class="${current === c.key ? "on" : ""}">${esc(c.label)}<span class="pick${chosen ? " done" : ""}">${chosen ? `choisie : ${esc(chosen.name)}` : `${c.variants.length} variantes, rien de choisi`}</span></button>`;
	}).join("");
	document.getElementById("nav").innerHTML = `<button data-case="__overview" class="${current === "__overview" ? "on" : ""}">Vue d'ensemble<span class="pick">le choix de chaque cas, côte à côte</span></button><hr>${items}`;
}

function render() {
	renderNav();
	const main = document.getElementById("main");
	if (current === "__overview") {
		const pickers = { choix: "Les choix", actuelle: "Actuelles (démon)", c: "C · un coup d'œil" };
		main.innerHTML = `<div class="overview"><h2>Vue d'ensemble</h2><p class="moment">Afficher : ${Object.entries(pickers).map(([k, l]) => `<button class="btn${view.overview === k ? " primary" : ""}" data-overview="${k}">${l}</button>`).join(" ")}<br>Pour juger l'ensemble : même ton, même rythme, même place du bouton principal. « Les choix » montre la variante choisie de chaque cas (à défaut, la première).</p><div class="grid">${state.cases.map((c) => {
			const byKind = view.overview === "c" ? c.variants.find((x) => x.id === `${c.key}-c`) : view.overview === "actuelle" ? c.variants.find((x) => x.id === `${c.key}-actuelle`) : undefined;
			const v = byKind ?? c.variants.find((x) => x.id === state.choices[c.key]) ?? c.variants[0];
			return `<div class="cell"><h3>${esc(c.label)} · <span style="color:var(--muted);font-weight:400">${esc(v.name)}</span></h3><div class="desk">${panel(v)}</div></div>`;
		}).join("")}</div>
		<p class="rules">Repères : se lit en 3 s ; le titre est la réponse (une ligne) ; une ligne de corps au plus ; une seule action ; le détail est derrière le bouton ; ni emoji ni « ! ».</p></div>`;
		markCut(main);
		return;
	}
	const c = currentCase();
	main.innerHTML = `<p class="moment"><b>${esc(c.label)}.</b> ${esc(c.moment)}</p>
		<div class="columns">${c.variants.map((v) => column(c, v)).join("")}</div>
		<div class="notes"><h2>Remarques sur ce cas</h2><textarea id="notes" rows="3" placeholder="Ce qui marche, ce qui gêne, ce qu'on décide…">${esc(state.notes[c.key] ?? "")}</textarea>
		<div class="tools" style="padding:8px 0;border:0"><button class="btn" id="reset">Revenir aux variantes d'origine</button></div></div>`;
	for (const v of c.variants) refresh(v.id);
}

function column(c, v) {
	const chosen = state.choices[c.key] === v.id;
	return `<section class="col${chosen ? " chosen" : ""}" data-variant="${v.id}">
		<div class="col-head"><input type="text" data-field="name" value="${esc(v.name)}" aria-label="Nom de la variante"></div>
		<div class="desk" data-preview></div>
		<ul class="checks" data-checks></ul>
		<div class="editor">
			<div class="field"><label>Titre <span data-count></span></label><input type="text" data-field="title" value="${esc(v.title)}"></div>
			<div class="field"><label>Corps <span>**gras** · \`code\` · [lien](url) · ligne vide = nouvelle ligne</span></label><textarea data-field="body" rows="4">${esc(v.body)}</textarea></div>
			<div class="field"><label>Boutons <span>principal · supprimer</span></label>
				${v.buttons.map((b, i) => `<div class="btnrow" data-button="${i}">
					<input type="text" data-bfield="label" value="${esc(b.label)}" aria-label="Libellé">
					<select data-bfield="kind">${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}"${b.kind === k ? " selected" : ""}>${l}</option>`).join("")}</select>
					<input type="radio" name="primary-${v.id}" data-bfield="primary"${b.primary ? " checked" : ""} title="Bouton principal">
					<button class="icon" data-remove="${i}" title="Supprimer">✕</button>
					${b.kind === "retour" ? "" : `<input type="text" class="value" data-bfield="value" value="${esc(b.value)}" placeholder="${b.kind === "lien" ? "URL" : "Texte copié"}">`}
				</div>`).join("")}
				<button class="btn" data-add>+ bouton</button>
			</div>
		</div>
		<div class="tools">
			<button class="btn choose${chosen ? " on" : ""}" data-choose>${chosen ? "Choisie" : "Choisir"}</button>
			<button class="btn primary" data-send>Envoyer dans Screenpipe</button>
			<button class="btn" data-duplicate>Dupliquer</button>
			<button class="btn" data-delete>Supprimer</button>
		</div>
		<div class="sendinfo" data-sendinfo></div>
	</section>`;
}

function markCut(root) {
	const cut = [];
	for (const button of root.querySelectorAll(".sp-btn")) {
		const isCut = button.scrollWidth > button.clientWidth + 1;
		button.classList.toggle("cut", isCut);
		if (isCut) cut.push(button.textContent);
	}
	return cut;
}

function refresh(id) {
	const col = document.querySelector(`[data-variant="${id}"]`);
	if (!col) return;
	const [, v] = findVariant(id);
	const preview = col.querySelector("[data-preview]");
	preview.innerHTML = panel(v);
	const cut = markCut(preview);
	col.querySelector("[data-checks]").innerHTML = checks(v, cut);
	col.querySelector("[data-count]").textContent = `${v.title.length} / 40`;
}

let saveTimer;
function save() {
	document.getElementById("saved").textContent = "…";
	clearTimeout(saveTimer);
	saveTimer = setTimeout(async () => {
		try {
			const r = await fetch("/api/state", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(state) });
			document.getElementById("saved").textContent = r.ok ? `Enregistré ${new Date().toLocaleTimeString("fr-FR")}` : "Échec de l'enregistrement";
		} catch {
			document.getElementById("saved").textContent = "Studio arrêté ?";
		}
	}, 400);
}

document.addEventListener("input", (event) => {
	const target = event.target;
	if (target.id === "notes") { state.notes[current] = target.value; save(); return; }
	const col = target.closest("[data-variant]");
	if (!col) return;
	const [, v] = findVariant(col.dataset.variant);
	if (target.dataset.field) {
		v[target.dataset.field] = target.value;
		if (target.dataset.field === "name") renderNav();
	}
	const row = target.closest("[data-button]");
	if (row && target.dataset.bfield) {
		const button = v.buttons[Number(row.dataset.button)];
		const field = target.dataset.bfield;
		if (field === "primary") v.buttons.forEach((b) => (b.primary = b === button));
		else button[field] = target.value;
		if (field === "kind") { if (button.kind === "retour") button.value = ""; render(); save(); return; }
	}
	refresh(v.id);
	save();
});

document.addEventListener("click", async (event) => {
	const target = event.target.closest("button");
	if (!target) return;
	if (target.dataset.overview) { view.overview = target.dataset.overview; localSet("studio-overview", view.overview); render(); return; }
	if (target.dataset.case) { current = target.dataset.case; localSet("studio-case", current); render(); window.scrollTo(0, 0); return; }
	if (target.id === "reset") {
		if (!confirm("Remplacer les variantes de ce cas par celles d'origine ? Vos modifications sur ce cas seront perdues.")) return;
		const defaults = await (await fetch("/api/defaults")).json();
		const fresh = defaults.find((c) => c.key === current);
		if (fresh) state.cases = state.cases.map((c) => (c.key === current ? fresh : c));
		delete state.choices[current];
		render(); save(); return;
	}
	const col = target.closest("[data-variant]");
	if (!col) return;
	const c = currentCase();
	const [, v] = findVariant(col.dataset.variant);
	if (target.dataset.remove !== undefined) { v.buttons.splice(Number(target.dataset.remove), 1); render(); save(); }
	else if (target.hasAttribute("data-add")) { v.buttons.push({ label: "Nouveau", kind: "copier", value: "", primary: v.buttons.length === 0 }); render(); save(); }
	else if (target.hasAttribute("data-choose")) { state.choices[c.key] = state.choices[c.key] === v.id ? undefined : v.id; render(); save(); }
	else if (target.hasAttribute("data-duplicate")) {
		const copy = structuredClone(v);
		copy.id = `${c.key}-${Date.now().toString(36)}`;
		copy.name = `${v.name} (copie)`;
		c.variants.splice(c.variants.indexOf(v) + 1, 0, copy);
		render(); save();
	} else if (target.hasAttribute("data-delete")) {
		if (c.variants.length === 1) return;
		if (!confirm(`Supprimer la variante « ${v.name} » ?`)) return;
		c.variants = c.variants.filter((x) => x !== v);
		if (state.choices[c.key] === v.id) delete state.choices[c.key];
		render(); save();
	} else if (target.hasAttribute("data-send")) {
		const info = col.querySelector("[data-sendinfo]");
		info.textContent = "Envoi…";
		try {
			const { outcome } = await (await fetch("/api/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(v) })).json();
			const said = { shown: "Affichée dans le panneau Screenpipe.", paused: "Screenpipe est en pause : rien d'affiché.", unreachable: "Screenpipe ne répond pas (port 11435).", duplicate: "Écartée : déjà envoyée il y a moins de 90 s." };
			info.textContent = said[outcome] ?? `Screenpipe : ${outcome}`;
		} catch {
			info.textContent = "Le studio ne répond pas : relancer bun run studio:notifs.";
		}
	}
});

for (const [id, key] of [["sp-theme", "theme"], ["sp-tall", "tall"]]) {
	const el = document.getElementById(id);
	if (key === "theme") el.value = view.theme; else el.checked = view.tall;
	el.addEventListener("change", () => {
		view[key] = key === "theme" ? el.value : el.checked;
		localSet(id, key === "theme" ? el.value : el.checked ? "1" : "0");
		render();
	});
}

(async () => {
	state = await (await fetch("/api/state")).json();
	const remembered = new URLSearchParams(location.search).get("c") ?? localGet("studio-case", "__overview");
	current = remembered === "__overview" || state.cases.some((c) => c.key === remembered) ? remembered : "__overview";
	render();
	document.fonts?.ready.then(() => render());
})();
</script>
